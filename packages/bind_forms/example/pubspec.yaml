name: bind_forms_example
description: Login form built with real Material widgets bound by bind_forms.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  bind_forms: ^0.0.1
  bind_forms_signals: ^0.0.1
  cupertino_ui: ^1.0.0
  material_ui: ^1.7.0
  signals_flutter: ^7.1.0

  # Third-party widgets showcased without wrappers. Each one has a
  # reactive_forms_widgets wrapper package that re-declares its constructor.
  animated_toggle_switch: ^0.8.7
  cart_stepper: ^4.3.0
  code_text_field: ^1.1.0
  direct_select: ^2.0.0
  dropdown_search:
    git:
      url: https://github.com/salim-lachdhaf/dropdown_search.git
  extended_text_field: ^17.0.0
  fancy_password_field: ^3.0.0
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  fluent_ui: ^4.16.1
  flutter_advanced_switch: ^3.2.1
  flutter_colorpicker: ^1.1.0
  flutter_native_text_input: ^2.4.0
  flutter_rating_bar: ^4.0.1
  flutter_typeahead:
    git:
      url: https://github.com/abdulhaq-e/flutter_typeahead.git
      ref: master
  fluttercontactpicker: ^5.0.0
  getwidget: ^7.0.2
  image_picker: ^1.2.4
  language_picker: ^0.4.5
  languagetool_textfield: ^1.0.0
  macos_ui: ^2.2.2
  month_picker_dialog: ^6.7.3
  multi_select_flutter: ^4.1.3
  phone_form_field: ^12.0.1
  pin_code_fields: ^10.1.1
  pin_input_text_field: ^4.5.3
  pinput: ^7.0.0
  signature: ^6.4.0
  sleek_circular_slider: ^2.1.0
  syncfusion_flutter_signaturepad: ^35.1.40+1
  textfield_tags: ^3.0.1
  toggle_switch: ^2.3.0
  wechat_assets_picker: ^10.1.3
  wechat_camera_picker: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
