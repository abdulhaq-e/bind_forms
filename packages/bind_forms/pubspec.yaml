name: bind_forms
description: Bind Flutter widgets to bind_forms_core controls without wrapping them.
version: 0.0.1
repository: https://github.com/abdulhaq-e/bind_forms/tree/main/packages/bind_forms
issue_tracker: https://github.com/abdulhaq-e/bind_forms/issues
resolution: workspace

environment:
  sdk: ^3.13.3
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  bind_forms_core: ^0.0.1
  intl: ">=0.18.1 <1.0.0"
  # Only for TimeOfDayValueAccessor, in the opt-in
  # `package:bind_forms/material_ui.dart` library; the main library doesn't
  # import it.
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
