name: Set up workspace
description: Installs the pinned Flutter SDK and resolves the pub workspace.

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        # Keep in step with the version the workspace is developed against.
        flutter-version: 3.47.4
        channel: stable
        cache: true

    - name: Resolve dependencies
      shell: bash
      run: flutter pub get
