# Releases one package: publish to pub.dev, then tag and create the GitHub
# Release. The tag is a record of what shipped, not a trigger for shipping
# it, so a failed publish never leaves a tag behind.
#
# Run it from the Actions tab on main, once the version bump is merged.
#
# Authentication: pub.dev's GitHub publishing only accepts runs triggered by
# a tag push, which would make the tag come first. Instead this publishes
# with a Google Cloud service account, impersonated through Workload
# Identity Federation: no stored secrets. See "Releasing" in the README for
# the one-time setup and the two repository variables it needs.
name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options: [bind_forms_core, bind_forms, bind_forms_signals]
      version:
        description: "Version to release (e.g. 0.1.0), without the leading 'v'. Must match the package's pubspec."
        required: true
        type: string

# One release per package at a time; never cancel a release midway.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.package }}
  cancel-in-progress: false

permissions: {}

# Inputs reach scripts through the environment only, never pasted into them.
env:
  PACKAGE: ${{ inputs.package }}
  VERSION: ${{ inputs.version }}
  TAG: ${{ inputs.package }}-v${{ inputs.version }}

jobs:
  # The version matches the pubspec and has a CHANGELOG entry, is neither on
  # pub.dev nor tagged yet, and its workspace dependencies are already on
  # pub.dev. Then the usual checks, on the exact commit that will ship.
  verify:
    name: Verify ${{ inputs.package }} ${{ inputs.version }}
    if: github.repository_owner == 'abdulhaq-e' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.check.outputs.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check release
        id: check
        run: python3 tool/release.py verify "$PACKAGE" "$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: ${{ steps.check.outputs.dir }}
        run: |
          if grep -q 'sdk: flutter' pubspec.yaml; then flutter test; else dart test; fi

      - name: Validate package
        working-directory: ${{ steps.check.outputs.dir }}
        run: flutter pub publish --dry-run

  publish:
    name: Publish to pub.dev
    needs: verify
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      # Same commit the verify job checked; pub publishes from source.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PUB_DEV_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: https://pub.dev
          id_token_include_email: true # pub.dev identifies the service account by email
          create_credentials_file: false

      - name: Publish
        working-directory: ${{ needs.verify.outputs.dir }}
        env:
          PUB_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          dart pub publish --force

  # Only once pub.dev publishing has succeeded. If this job fails, re-run it
  # alone ("Re-run failed jobs"): it tags the same commit that was published.
  tag-and-release:
    name: Tag release and create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Tag and push
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/release.py notes "$PACKAGE" "$VERSION" > notes.md
          gh release create "$TAG" --verify-tag \
            --title "$PACKAGE $VERSION" \
            --notes-file notes.md
