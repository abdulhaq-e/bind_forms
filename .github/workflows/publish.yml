# Publishes a package to pub.dev when its release tag is pushed:
#
#   bind_forms_core-v0.1.0   bind_forms-v0.1.0   bind_forms_signals-v0.1.0
#
# Uses pub.dev automated publishing (GitHub OIDC), so there are no secrets.
# Each package must enable it on pub.dev (Admin > Automated publishing)
# with this repository, tag pattern `<package>-v{{version}}`, and, if
# required there, the `pub.dev` environment used below.
name: Publish

on:
  push:
    tags:
      - 'bind_forms_core-v[0-9]+.[0-9]+.[0-9]+*'
      - 'bind_forms_signals-v[0-9]+.[0-9]+.[0-9]+*'
      - 'bind_forms-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      dir: ${{ steps.tag.outputs.dir }}
    steps:
      - uses: actions/checkout@v7

      # The tag matches the pubspec version, that version isn't published
      # yet, and every workspace package it depends on is already on pub.dev.
      - name: Check tag
        id: tag
        run: python3 tool/release.py verify-tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          if grep -q 'sdk: flutter' pubspec.yaml; then flutter test; else dart test; fi

      - name: Validate package
        working-directory: ${{ steps.tag.outputs.dir }}
        run: flutter pub publish --dry-run

  publish:
    name: Publish ${{ needs.verify.outputs.package }}
    needs: verify
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # pub.dev automated publishing
    steps:
      - uses: actions/checkout@v7

      # Exchanges the GitHub OIDC token for pub.dev credentials. The token is
      # short-lived, so this job does nothing slow after it.
      - uses: dart-lang/setup-dart@v1

      - uses: ./.github/actions/setup

      - name: Publish
        working-directory: ${{ needs.verify.outputs.dir }}
        run: dart pub publish --force
