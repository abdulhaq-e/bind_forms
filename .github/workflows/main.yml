name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-example:
    name: Build example (Linux)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # Builds every showcased plugin's native code, which widget tests
      # don't exercise.
      - name: Build
        working-directory: packages/bind_forms/example
        run: flutter build linux --release

  release-status:
    name: Release status
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lists which package versions aren't on pub.dev yet, with the tag
      # command for each one that can be released now.
      - name: Summarize
        run: python3 tool/release.py status >> "$GITHUB_STEP_SUMMARY"
